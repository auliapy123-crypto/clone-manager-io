services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads
  frontend:
    build:
      context: ./fe-accounting
      args:
        VITE_API_URL: http://localhost:4000
        VITE_APP_NAME: Clone Manager Accounting
    ports:
      - "3000:3000"
    depends_on:
      - backend
